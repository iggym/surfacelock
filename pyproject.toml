[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "surfacelock"
version = "0.1.0"
description = "A lockfile for the AI surface of your codebase — pins models, prompts, tool schemas and MCP servers, and fails CI when they drift."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "surfacelock contributors" }]
keywords = ["ai", "lockfile", "llm", "prompts", "mcp", "ci", "governance", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6.0",
  "tomli-w>=1.0",
  "pathspec>=0.12",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/iggym/surfacelock"
Documentation = "https://iggym.github.io/surfacelock/"
Repository = "https://github.com/iggym/surfacelock"
Changelog = "https://github.com/iggym/surfacelock/blob/main/CHANGELOG.md"
Issues = "https://github.com/iggym/surfacelock/issues"

[project.scripts]
surfacelock = "surfacelock.cli:console_main"

[tool.hatch.build.targets.wheel]
packages = ["src/surfacelock"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/registry",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# ➕/➖ are intentional in user-facing diff output.
allowed-confusables = ["➕", "➖", "✏", "—", "–", "·", "×"]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/surfacelock"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml", "pathspec", "pathspec.*", "tomli_w"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running performance tests (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/surfacelock"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
