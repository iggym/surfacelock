name: Bug report
description: Something is broken — a crash, a wrong exit code, bad output.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest repository or command that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: surfacelock version
      description: Output of `surfacelock --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: 3.12.4 on macOS 15
    validations:
      required: true
